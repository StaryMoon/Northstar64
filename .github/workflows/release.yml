name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: northstar64-linux-x86_64
          - os: macos-14
            asset: northstar64-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches source version
        shell: bash
        run: |
          source_version=$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' include/northstar64/version.hpp)
          test "v${source_version}" = "${GITHUB_REF_NAME}"
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNORTHSTAR64_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Stage archive
        shell: bash
        run: |
          staging="${{ matrix.asset }}"
          mkdir -p "$staging/bin" "$staging/include"
          cp build/northstar64 "$staging/bin/"
          cp -R include/northstar64 "$staging/include/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "${{ matrix.asset }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded archives
        working-directory: dist
        run: for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "Northstar64 ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"

